server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/css,application/javascript,text/html,application/xml
    min-response-size: 1024

spring:
  application:
    name: english-speaking-ai-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/english_speaking_ai}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
          fetch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  version: 0.1.0
  supabase:
    url: ${SUPABASE_URL:}
    jwt-issuer: ${SUPABASE_JWT_ISSUER:}
    jwt-audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
    jwks-url: ${SUPABASE_JWKS_URL:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:}
  quota:
    default-daily-minutes: 15
    max-daily-turns: 100
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
