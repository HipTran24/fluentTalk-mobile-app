# Test profile configuration for hermetic execution
spring:
  datasource:
    url: jdbc:h2:mem:english_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  version: 0.1.0-test
  supabase:
    url: https://test.supabase.co
    jwt-issuer: https://test.supabase.co/auth/v1
    jwt-secret: test-secret
  gemini:
    api-key: test-gemini-key
    model: gemini-2.0-flash
